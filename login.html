<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Entre no sistema Elite Step.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 512'><path fill='%23ff0040' d='M416 0C352.3 0 256 32 256 32l0 128c48 0 76 16 104 32s56 32 104 32c56.4 0 176-16 176-96S512 0 416 0zM128 96c0 35.3 28.7 64 64 64l32 0 0-128-32 0c-35.3 0-64 28.7-64 64zM288 512c96 0 224-48 224-128s-119.6-96-176-96c-48 0-76 16-104 32s-56 32-104 32l0 128s96.3 32 160 32zM0 416c0 35.3 28.7 64 64 64l32 0 0-128-32 0c-35.3 0-64 28.7-64 64z'/></svg>">
  <title>Entrar - ELITE STEP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;900&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<script>try{if(localStorage.getItem("eliteTheme")==="light"){document.body.setAttribute("data-theme","light")}}catch(e){}</script>

  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <span class="logo-icon"><i class="fa-solid fa-shoe-prints"></i></span> ELITE STEP
      </a>
      <nav class="nav" id="nav">
        <a href="index.html" class="nav-link">Produtos</a>
        <a href="favoritos.html" class="nav-link">Favoritos</a>
        <a href="carrinho.html" class="nav-link">Carrinho</a>
        <a href="checkout.html" class="nav-link">Checkout</a>
        <a href="login.html" class="nav-link nav-active" id="authLink">Entrar</a>
        <a href="cadastro.html" class="nav-link">Cadastrar</a>
      </nav>
      <div class="header-actions">
        <a href="favoritos.html" class="cart-btn" aria-label="Favoritos"><i class="fa-solid fa-heart"></i><span class="cart-count" id="favCount">0</span></a>
        <a href="carrinho.html" class="cart-btn" aria-label="Carrinho"><i class="fa-solid fa-cart-shopping"></i><span class="cart-count" id="cartCount">0</span></a>
        <button class="theme-toggle" id="themeToggle" aria-label="Alternar tema"><i class="fa-solid fa-moon"></i></button>
        <button class="menu-toggle" id="menuToggle" aria-label="Menu"><span></span><span></span><span></span></button>
      </div>
    </div>
  </header>

  <section class="page-section">
    <div class="container auth-wrap">
      <h1 class="page-title"><i class="fa-solid fa-user fa-title-icon"></i> ENTRAR</h1>
      <p class="page-subtitle">Acesse sua conta. Novo por aqui? <a href="cadastro.html" style="color:var(--primary)">Crie sua conta grátis</a>.</p>

      <div class="auth-card" id="authCard">
        <form id="loginForm" class="auth-form">
          <div class="form-field"><input type="email" id="loginEmail" placeholder="Seu e-mail" autocomplete="email" required></div>
          <div class="form-field"><input type="password" id="loginPass" placeholder="Sua senha" autocomplete="current-password" required></div>
          <button type="submit" class="btn btn-primary btn-full">ENTRAR</button>
          <p class="auth-hint">Não tem conta? <a href="cadastro.html" style="text-decoration:underline">Cadastre-se</a>.</p>
        </form>
      </div>

      <div class="auth-card" id="loggedCard" style="display:none">
        <h2 class="checkout-title">OLA, <span id="loggedName"></span>!</h2>
        <p class="page-subtitle" id="loggedEmail"></p>
        <div class="checkout-nav">
          <a href="checkout.html" class="btn btn-primary" style="flex:1;text-align:center">IR AO CHECKOUT</a>
          <button class="btn btn-secondary" id="logoutBtn" style="flex:1">SAIR</button>
        </div>
      </div>
    </div>
  </section>

  <script src="script.js"></script>
  <script>
    const loginForm = document.getElementById("loginForm");

    function getUsers() {
      try { return JSON.parse(localStorage.getItem("eliteUsers")) || []; } catch { return []; }
    }
    function setSession(s) {
      if (s) localStorage.setItem("eliteSession", JSON.stringify(s));
      else localStorage.removeItem("eliteSession");
      renderAuthState();
      if (typeof updateAuthUI === "function") updateAuthUI();
    }

    function renderAuthState() {
      let sess = null;
      try { sess = JSON.parse(localStorage.getItem("eliteSession") || "null"); } catch {}
      const logged = !!sess;
      document.getElementById("authCard").style.display = logged ? "none" : "block";
      document.getElementById("loggedCard").style.display = logged ? "block" : "none";
      if (logged) {
        document.getElementById("loggedName").textContent = (sess.name || "ATLETA").toUpperCase();
        document.getElementById("loggedEmail").textContent = sess.email;
      }
    }

    loginForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const email = document.getElementById("loginEmail").value.trim().toLowerCase();
      const pass = document.getElementById("loginPass").value;
      const user = getUsers().find(u => u.email === email);
      if (!user || user.pass !== btoa(pass)) { showToast("E-mail ou senha inválidos!"); return; }
      setSession({ name: user.name, email: user.email });
      showToast("Bem-vindo de volta!");
    });

    document.getElementById("logoutBtn").addEventListener("click", () => {
      setSession(null);
      showToast("Você saiu da conta.");
    });

    renderAuthState();
  </script>
</body>
</html>
