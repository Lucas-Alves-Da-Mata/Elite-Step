<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Crie sua conta grátis na Elite Step.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 512'><path fill='%23ff0040' d='M416 0C352.3 0 256 32 256 32l0 128c48 0 76 16 104 32s56 32 104 32c56.4 0 176-16 176-96S512 0 416 0zM128 96c0 35.3 28.7 64 64 64l32 0 0-128-32 0c-35.3 0-64 28.7-64 64zM288 512c96 0 224-48 224-128s-119.6-96-176-96c-48 0-76 16-104 32s-56 32-104 32l0 128s96.3 32 160 32zM0 416c0 35.3 28.7 64 64 64l32 0 0-128-32 0c-35.3 0-64 28.7-64 64z'/></svg>">
  <title>Criar conta - ELITE STEP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<script>try{if(localStorage.getItem("eliteTheme")==="light"){document.body.setAttribute("data-theme","light")}}catch(e){}</script>
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo"><span class="logo-icon"><i class="fa-solid fa-shoe-prints"></i></span> ELITE STEP</a>
      <div class="header-actions">
        <button class="theme-toggle" id="themeToggle" aria-label="Alternar tema"><i class="fa-solid fa-moon"></i></button>
      </div>
    </div>
  </header>
  <section class="page-section">
    <div class="container auth-wrap">
      <h1 class="page-title"><i class="bi bi-person-plus fa-title-icon"></i> CRIAR CONTA</h1>
      <p class="page-subtitle">Cadastro grátis em 30 segundos.</p>
      <div class="auth-card">
        <form id="signupForm" class="auth-form">
          <div class="form-field"><input type="text" id="suName" placeholder="Nome completo" autocomplete="name" required minlength="2"></div>
          <div class="form-field"><input type="email" id="suEmail" placeholder="Seu melhor e-mail" autocomplete="email" required></div>
          <div class="row">
            <div class="col-6"><div class="form-field"><input type="password" id="suPass" placeholder="Senha (min 4)" autocomplete="new-password" required minlength="4"></div></div>
            <div class="col-6"><div class="form-field"><input type="password" id="suPass2" placeholder="Repetir senha" autocomplete="new-password" required></div></div>
          </div>
          <button type="submit" class="btn btn-primary btn-full">CRIAR CONTA GRÁTIS</button>
          <p class="auth-switch">Já tem conta? <a href="login.html">Acesse sua conta aqui</a></p>
          <p class="auth-hint"><i class="bi bi-shield-lock"></i> Dados salvos localmente (demo front-end).</p>
        </form>
      </div>
    </div>
  </section>
  <script src="script.js"></script>
  <script>
    function getUsers() { try { return JSON.parse(localStorage.getItem("eliteUsers")) || []; } catch { return []; } }
    // Hash SHA-256 da senha (com fallback para navegadores sem WebCrypto)
    async function hashPass(p) {
      try {
        const data = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("elite-step::" + p));
        return "sha256:" + [...new Uint8Array(data)].map(b => b.toString(16).padStart(2, "0")).join("");
      } catch (e) {
        return "b64:" + btoa(p);
      }
    }
    document.getElementById("signupForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("suName").value.trim();
      const email = document.getElementById("suEmail").value.trim().toLowerCase();
      const p1 = document.getElementById("suPass").value;
      const p2 = document.getElementById("suPass2").value;
      if (name.length < 2) { showToast("Informe seu nome!"); return; }
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { showToast("E-mail inválido!"); return; }
      if (p1.length < 4) { showToast("Senha muito curta!"); return; }
      if (p1 !== p2) { showToast("Senhas não conferem!"); return; }
      const users = getUsers();
      if (users.some(u => u.email === email)) { showToast("E-mail já cadastrado! Faça login."); window.location.href = "login.html"; return; }
      users.push({ name, email, pass: await hashPass(p1), createdAt: Date.now() });
      localStorage.setItem("eliteUsers", JSON.stringify(users));
      localStorage.setItem("eliteSession", JSON.stringify({ name, email }));
      showToast("Conta criada! Bem-vindo!");
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
