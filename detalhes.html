<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Veja os detalhes do tenis, precos, tamanhos e cores. Elite Step - Tenis de alta performance.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 512'><path fill='%23ff0040' d='M416 0C352.3 0 256 32 256 32l0 128c48 0 76 16 104 32s56 32 104 32c56.4 0 176-16 176-96S512 0 416 0zM128 96c0 35.3 28.7 64 64 64l32 0 0-128-32 0c-35.3 0-64 28.7-64 64zM288 512c96 0 224-48 224-128s-119.6-96-176-96c-48 0-76 16-104 32s-56 32-104 32l0 128s96.3 32 160 32zM0 416c0 35.3 28.7 64 64 64l32 0 0-128-32 0c-35.3 0-64 28.7-64 64z'/></svg>">
  <title>Detalhes - ELITE STEP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;900&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<script>try{if(localStorage.getItem("eliteTheme")==="light"){document.body.setAttribute("data-theme","light")}}catch(e){}</script>

  <!-- HEADER -->
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <span class="logo-icon"><i class="fa-solid fa-shoe-prints"></i></span> ELITE STEP
      </a>
      <nav class="nav" id="nav">
        <a href="index.html" class="nav-link">Produtos</a>
        <a href="favoritos.html" class="nav-link">Favoritos</a>
        <a href="carrinho.html" class="nav-link">Carrinho</a>
      </nav>
      <div class="header-actions">
        <a href="favoritos.html" class="cart-btn" id="favBtn" aria-label="Favoritos"><i class="fa-solid fa-heart"></i><span class="cart-count" id="favCount">0</span></a>
        <a href="carrinho.html" class="cart-btn" id="cartBtn" aria-label="Carrinho"><i class="fa-solid fa-cart-shopping"></i><span class="cart-count" id="cartCount">0</span></a>
        <button class="theme-toggle" id="themeToggle" aria-label="Alternar tema"><i class="fa-solid fa-moon"></i></button>
        <button class="menu-toggle" id="menuToggle" aria-label="Menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <!-- DETALHES -->
  <section class="detalhes-page">
    <div class="container">
      <a href="index.html" class="back-btn">← VOLTAR</a>
      <div class="detalhes-grid" id="detalhesContent">
        <!-- Preenchido via JS -->
      </div>
    </div>
  </section>

  <!-- PRODUTOS RELACIONADOS -->
  <section class="relacionados" id="relacionadosSection">
    <div class="container">
      <h2 class="section-title">Voce Tambem Pode Gostar</h2>
      <div class="products-grid" id="relacionadosGrid"></div>
    </div>
  </section>

  <script src="script.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const productId = Number(params.get("id"));

    if (productId) {
      const product = products.find(p => p.id === productId);
      if (product) {
        document.title = product.name + " - ELITE STEP";
        renderDetalhes(product);
        renderRelacionados(product);
      }
    }

    function renderDetalhes(p) {
      const isFav = favorites.includes(p.id);
      document.getElementById("detalhesContent").innerHTML = `
        <div class="detalhes-image">
          <div class="detalhes-bg" style="background:${p.bg}"></div>
          <img src="${p.image}" alt="${p.name}" class="detalhes-shoe" id="detMainImg"
               onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 200 200%22><rect fill=%22%23111%22 width=%22200%22 height=%22200%22/><text x=%22100%22 y=%22110%22 text-anchor=%22middle%22 fill=%22%23ff0040%22 font-size=%2240%22>${p.brand.charAt(0)}</text></svg>'">
          ${p.badge ? `<span class="detalhes-badge badge-${p.badge}">${
            p.badge === "new" ? "NOVO" : p.badge === "sale" ? `${Math.round((1 - p.price / p.oldPrice) * 100)}% OFF` : "POPULAR"
          }</span>` : ''}
        </div>
        <div class="detalhes-info">
          <span class="detalhes-brand">${p.brand}</span>
          <span class="detalhes-cat">${p.cat}</span>
          <h1 class="detalhes-name">${p.name}</h1>
          <div class="detalhes-rating">
            <span class="stars">${getStars(p.rating)}</span>
            <span class="rating-count">(${p.reviews} avaliacoes)</span>
          </div>
          <div class="detalhes-price">
            <span class="price-main">${formatPrice(p.price)}</span>
            ${p.oldPrice ? `<span class="price-old">${formatPrice(p.oldPrice)}</span>` : ''}
          </div>
          <p class="detalhes-desc">${p.desc}</p>
          <table class="spec-table">
            <tr><td><i class="bi bi-tag"></i> Marca</td><td>${p.brand}</td></tr>
            <tr><td><i class="bi bi-grid"></i> Categoria</td><td>${p.cat}</td></tr>
            <tr><td><i class="bi bi-star"></i> Avaliação</td><td>${p.rating} (${p.reviews} avaliações)</td></tr>
            <tr><td><i class="bi bi-rulers"></i> Tamanhos</td><td>${p.sizes[0]} ao ${p.sizes[p.sizes.length-1]}</td></tr>
            <tr><td><i class="bi bi-box-seam"></i> Estoque</td><td>Disponível</td></tr>
          </table>
          <div class="frete-box">
            <input type="text" id="freteCep" placeholder="Calcular frete: digite seu CEP" maxlength="8" inputmode="numeric">
            <button class="btn btn-secondary" id="freteBtn" type="button">OK</button>
          </div>
          <p class="frete-result" id="freteResult"></p>
          <div class="detalhes-options">
            <div class="option-group">
              <label>TAMANHO</label>
              <div class="sizes" id="detSizes">${p.sizes.map(s =>
                `<button class="size-btn" data-size="${s}">${s}</button>`
              ).join('')}</div>
            </div>
            <div class="option-group">
              <label>COR</label>
              <div class="colors" id="detColors">${p.colors.map((c, i) =>
                `<button class="color-dot ${i === 0 ? 'active' : ''}" data-color="${c}" style="background:${c}"></button>`
              ).join('')}</div>
            </div>
          </div>
          <div class="detalhes-actions">
            <button class="btn btn-primary btn-full" id="detAddCart">ADICIONAR AO CARRINHO</button>
            <button class="btn btn-secondary fav-btn ${isFav ? 'fav-active' : ''}" id="detFavBtn">${isFav ? '<i class="fa-solid fa-heart"></i> FAVORITADO' : '<i class="fa-regular fa-heart"></i> FAVORITAR'}</button>
            <button class="btn btn-secondary btn-full share-btn" onclick="shareProduct('${p.name}', '${p.id}')"><i class="fa-solid fa-share-nodes"></i> COMPARTILHAR</button>
          </div>
          <div class="detalhes-features">
            <div class="feature"><span><i class="fa-solid fa-truck"></i></span> Frete gratis acima de R$ 299</div>
            <div class="feature"><span><i class="fa-solid fa-arrows-rotate"></i></span> Troca gratis em 30 dias</div>
            <div class="feature"><span><i class="fa-solid fa-shield-halved"></i></span> Garantia de 1 ano</div>
            <div class="feature"><span><i class="fa-solid fa-credit-card"></i></span> Parcelamento em ate 12x</div>
          </div>
        </div>
      `;

      // Size selection
      let selectedSize = null;
      let selectedColor = p.colors[0];

      document.querySelectorAll("#detSizes .size-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll("#detSizes .size-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          selectedSize = Number(btn.dataset.size);
        });
      });

      document.querySelectorAll("#detColors .color-dot").forEach(dot => {
        dot.addEventListener("click", () => {
          document.querySelectorAll("#detColors .color-dot").forEach(d => d.classList.remove("active"));
          dot.classList.add("active");
          selectedColor = dot.dataset.color;
        });
      });

      document.getElementById("detAddCart").addEventListener("click", () => {
        if (!selectedSize) {
          showToast("Selecione um tamanho!");
          return;
        }
        addToCart(p, selectedSize, selectedColor);
        showToast(`${p.name} adicionado ao carrinho!`);
      });

      document.getElementById("detFavBtn").addEventListener("click", function() {
        toggleFavorite(p.id);
        const isFavNow = favorites.includes(p.id);
        this.innerHTML = isFavNow ? '<i class="fa-solid fa-heart"></i> FAVORITADO' : '<i class="fa-regular fa-heart"></i> FAVORITAR';
        this.classList.toggle('fav-active', isFavNow);
        showToast(isFavNow ? 'Adicionado aos favoritos!' : 'Removido dos favoritos!');
      });

      // Galeria: thumbs trocam a imagem principal
      const mainImg = document.getElementById("detMainImg");
      const gallery = [p.image, p.image.replace("w=600", "w=600&sat=-50"), p.image.replace("w=600", "w=600&crop=top")];
      const thumbsWrap = document.createElement("div");
      thumbsWrap.className = "det-thumbs";
      thumbsWrap.innerHTML = gallery.map((src, i) => `<img src="${src}" alt="Foto ${i+1} de ${p.name}" class="${i===0?'active':''}" loading="lazy">`).join("");
      mainImg.insertAdjacentElement("afterend", thumbsWrap);
      thumbsWrap.querySelectorAll("img").forEach((th) => {
        th.addEventListener("click", () => {
          thumbsWrap.querySelectorAll("img").forEach(t => t.classList.remove("active"));
          th.classList.add("active");
          mainImg.src = th.src;
        });
      });

      // Cálculo de frete simulado por CEP
      document.getElementById("freteBtn").addEventListener("click", () => {
        const cep = document.getElementById("freteCep").value.replace(/\D/g, "");
        const res = document.getElementById("freteResult");
        if (cep.length !== 8) { showToast("Digite um CEP com 8 números!"); return; }
        const valor = p.price >= 299 ? "GRÁTIS" : formatPrice(39.90);
        const prazo = 2 + (Number(cep.slice(-1)) % 5);
        res.innerHTML = `<i class="bi bi-truck"></i> Frete para ${cep}: <strong>${valor}</strong> · entrega em até ${prazo} dias úteis`;
      });

      updateCounts();
    }

    function shareProduct(name, id) {
      const url = window.location.origin + "/" + window.location.pathname.split("/").pop() + "?id=" + id;
      const text = `Conferi esse tenis na Elite Step: ${name}`;
      if (navigator.share) {
        navigator.share({ title: "Elite Step", text: text, url: url }).catch(() => {});
      } else {
        navigator.clipboard.writeText(url).then(() => {
          showToast("Link do produto copiado!");
        }).catch(() => {
          window.open('https://wa.me/?text=' + encodeURIComponent(text + " " + url), "_blank");
        });
      }
    }

    function renderRelacionados(p) {
      const related = products.filter(item => item.cat === p.cat && item.id !== p.id).slice(0, 4);
      if (related.length === 0) return;
      document.getElementById("relacionadosGrid").innerHTML = related.map((item, i) => `
        <div class="product-card" onclick="window.location.href='detalhes.html?id=${item.id}'" style="animation-delay:${i * 0.1}s">
          ${item.badge ? `<span class="product-badge badge-${item.badge}">${
            item.badge === "new" ? "NOVO" : item.badge === "sale" ? `${Math.round((1 - item.price / item.oldPrice) * 100)}% OFF` : "POPULAR"
          }</span>` : ''}
          <div class="product-image">
            <div class="product-bg" style="background:${item.bg}"></div>
            <img class="product-shoe-img" src="${item.image}" alt="${item.name}" loading="lazy"
                 onerror="this.style.display='none'">
          </div>
          <div class="product-info">
            <span class="product-brand">${item.brand}</span>
            <span class="product-cat">${item.cat}</span>
            <h3 class="product-name">${item.name}</h3>
            <div class="product-bottom">
              <span class="product-price">${formatPrice(item.price)}</span>
            </div>
          </div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
