<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Todos os tênis Elite Step. Nike, Jordan, Adidas, Puma e mais.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 512'><path fill='%23ff0040' d='M416 0C352.3 0 256 32 256 32l0 128c48 0 76 16 104 32s56 32 104 32c56.4 0 176-16 176-96S512 0 416 0zM128 96c0 35.3 28.7 64 64 64l32 0 0-128-32 0c-35.3 0-64 28.7-64 64zM288 512c96 0 224-48 224-128s-119.6-96-176-96c-48 0-76 16-104 32s-56 32-104 32l0 128s96.3 32 160 32zM0 416c0 35.3 28.7 64 64 64l32 0 0-128-32 0c-35.3 0-64 28.7-64 64z'/></svg>">
  <title>Produtos - ELITE STEP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;900&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<script>try{if(localStorage.getItem("eliteTheme")==="light"){document.body.setAttribute("data-theme","light")}}catch(e){}</script>

  <!-- FAIXA PROMOCIONAL -->
  <div class="promo-bar" id="promoBar">
    <p class="promo-text" id="promoText">MEGA SALE: até 90% OFF em modelos selecionados</p>
    <button class="promo-close" id="promoClose" aria-label="Fechar aviso">&times;</button>
  </div>

  <!-- HEADER -->
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <span class="logo-icon"><i class="fa-solid fa-shoe-prints"></i></span> ELITE STEP
      </a>
      <nav class="nav" id="nav">
        <a href="index.html" class="nav-link">Início</a>
        <a href="produtos.html" class="nav-link nav-active">Produtos</a>
        <a href="index.html#sobre" class="nav-link">Sobre</a>
        <a href="index.html#contato" class="nav-link">Contato</a>
      </nav>
      <div class="header-actions">
        <a href="favoritos.html" class="cart-btn" aria-label="Favoritos"><i class="fa-solid fa-heart"></i><span class="cart-count" id="favCount">0</span></a>
        <a href="carrinho.html" class="cart-btn" aria-label="Carrinho"><i class="fa-solid fa-cart-shopping"></i><span class="cart-count" id="cartCount">0</span></a>
        <a href="login.html" class="login-text-btn" id="authBtn">ENTRAR</a>
        <button class="theme-toggle" id="themeToggle" aria-label="Alternar tema"><i class="fa-solid fa-moon"></i></button>
        <button class="menu-toggle" id="menuToggle" aria-label="Menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <!-- TODOS OS PRODUTOS -->
  <section class="produtos page-section" id="produtos">
    <div class="container">
      <h1 class="page-title"><i class="fa-solid fa-shoe-prints fa-title-icon"></i> TODOS OS PRODUTOS</h1>
      <p class="page-subtitle">Explore o catálogo completo Elite Step.</p>

      <!-- BARRA DE BUSCA E FILTROS -->
      <div class="products-toolbar">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Buscar tênis por nome ou marca..." aria-label="Buscar produtos">
          <span class="search-icon"><i class="fa-solid fa-magnifying-glass"></i></span>
        </div>
        <div class="toolbar-controls">
          <select id="brandFilter" class="toolbar-select" aria-label="Filtrar por marca">
            <option value="todas">Todas as marcas</option>
          </select>
          <select id="priceFilter" class="toolbar-select" aria-label="Filtrar por preço">
            <option value="todos">Todos os preços</option>
            <option value="ate1300">Até R$ 1.300</option>
            <option value="1300_1700">R$ 1.300 - R$ 1.700</option>
            <option value="1700_2100">R$ 1.700 - R$ 2.100</option>
            <option value="acima2100">Acima de R$ 2.100</option>
          </select>
          <select id="sortSelect" class="toolbar-select" aria-label="Ordenar produtos">
            <option value="relevancia">Relevancia</option>
            <option value="menorPreco">Menor preço</option>
            <option value="maiorPreco">Maior preço</option>
            <option value="avaliação">Melhor avaliação</option>
          </select>
        </div>
      </div>

      <div class="products-grid" id="productsGrid">
        <!-- Preenchido via JS -->
      </div>
      <div id="productsPager" class="products-pager" style="margin-top:28px;display:flex;align-items:center;justify-content:center;gap:16px"></div>
    </div>
  </section>

  <!-- CARRINHO SIDEBAR -->
  <div class="cart-overlay" id="cartOverlay"></div>
  <aside class="cart-sidebar" id="cartSidebar">
    <div class="cart-header">
      <h3>Meu Carrinho</h3>
      <button class="cart-close" id="cartClose">&times;</button>
    </div>
    <div class="cart-items" id="cartItems">
      <p class="cart-empty">Seu carrinho está vazio.</p>
    </div>
    <div class="cart-footer" id="cartFooter" style="display:none;">
      <div class="cart-total">
        <span>Total:</span>
        <span id="cartTotal">R$ 0,00</span>
      </div>
      <a href="carrinho.html" class="btn btn-primary btn-full" style="display:block;text-align:center">FINALIZAR COMPRA</a>
    </div>
  </aside>

  <style>
    .pager-arrow {
      width: 48px; height: 48px; border-radius: 50%;
      background: #ff0040; color: #fff; border: none; cursor: pointer;
      font-size: 1.1rem; transition: transform .2s, opacity .2s;
    }
    .pager-arrow:hover { transform: scale(1.1); }
    .pager-arrow:disabled { opacity: .35; cursor: not-allowed; transform: none; }
    .pager-info { font-weight: 700; letter-spacing: 1px; }
  </style>
  <script>window.productsPaginated = true;</script>
  <script src="script.js"></script>
</body>
</html>
